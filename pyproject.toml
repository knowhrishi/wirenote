[project]
name = "wirenote"
version = "0.1.0"
description = "Private meeting notes for Linux: detects calls, records, transcribes and summarizes locally."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Hrishikesh Jadhav"}]
requires-python = ">=3.11"
keywords = ["meeting notes", "transcription", "whisper", "pipewire", "linux", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]
dependencies = [
    "anthropic>=2.3.0",
    "dbus-fast>=2.0",
    "faster-whisper>=1.2.1",
    "icalendar>=7.3.0",
    "recurring-ical-events>=3.8.2",
    "sherpa-onnx>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/knowhrishi/wirenote"
Issues = "https://github.com/knowhrishi/wirenote/issues"
Changelog = "https://github.com/knowhrishi/wirenote/blob/main/CHANGELOG.md"

[project.scripts]
wirenote = "wirenote.cli:main"

[dependency-groups]
dev = [
    "pyflakes>=4.0.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wirenote"]
# Non-Python files the program reads at run time: unit and desktop templates, the web UI.
artifacts = ["src/wirenote/data/*", "src/wirenote/ui/static/*"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "LICENSE", "README.md", "CHANGELOG.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
