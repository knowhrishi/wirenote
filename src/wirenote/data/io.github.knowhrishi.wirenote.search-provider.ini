# Wirenote in GNOME's search. GNOME reads these files only from system folders, so copy it
# once with sudo (docs/usage.md › Find a meeting from the launcher). `wirenote setup install`
# provides the desktop entry and the D-Bus service this names.
[Shell Search Provider]
DesktopId=io.github.knowhrishi.wirenote.desktop
BusName=io.github.knowhrishi.wirenote.Search
ObjectPath=/io/github/knowhrishi/wirenote/SearchProvider
Version=2
