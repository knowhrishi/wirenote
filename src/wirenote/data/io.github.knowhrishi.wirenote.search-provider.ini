# Wirenote in GNOME's search. It is off until you turn it on: run `wirenote setup search`
# first, which writes the D-Bus service this names (`wirenote setup install` provides the
# desktop entry). GNOME reads these files only from system folders, so then copy this one
# once with sudo (docs/usage.md › Find a meeting from the launcher).
[Shell Search Provider]
DesktopId=io.github.knowhrishi.wirenote.desktop
BusName=io.github.knowhrishi.wirenote.Search
ObjectPath=/io/github/knowhrishi/wirenote/SearchProvider
Version=2
