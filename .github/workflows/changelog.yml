name: Changelog

# A pull request that changes the app needs a CHANGELOG.md line: the notes are what
# users see in the app after an update. The `no-changelog` label skips the check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CHANGELOG.md changes with the app
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/check_changelog.py "$BASE" --labels "$LABELS"
