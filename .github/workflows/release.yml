name: Release

on:
  push:
    tags: ["v*"]
  # A dry run from any branch: every check, the build and the wheel tests, no publishing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: CI on the release commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  models:
    name: Real models on the release commit
    uses: ./.github/workflows/models.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: [checks, models]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write       # signs the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Tag matches the version in pyproject.toml
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          fi
      # Checked before anything is published, so a release never goes out with undated notes.
      # A dry run only warns: the section is dated just before tagging.
      - name: Release notes from CHANGELOG.md
        env:
          PRIVATE: ${{ github.event.repository.private }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          attested=""
          if [ "$PRIVATE" = "false" ]; then attested="--attested"; fi
          mkdir notes
          if ! uv run --no-project python scripts/release_notes.py "$VERSION" $attested > notes/release-notes.md; then
            if [ "$EVENT" = "push" ]; then exit 1; fi
            echo "::warning::CHANGELOG.md is not ready for $VERSION; a tag would stop here"
            echo "Dry run of $VERSION" > notes/release-notes.md
          fi
      # `uv build` makes the source archive, then the wheel from that archive, so a
      # file missing from the sdist breaks the build here rather than for a packager.
      - run: uv build
      # Artifact attestations are only available for public repositories on personal accounts,
      # and only a tagged build is attested: a dry run's files are never published.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: ${{ !github.event.repository.private && github.event_name == 'push' }}
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: notes/
          if-no-files-found: error

  wheel:
    name: Wheel on Python ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - if: matrix.python == '3.13'      # the audio test; see ci.yml
        run: scripts/ci_apt_install.sh ffmpeg
      # The exact file that goes to PyPI, installed as a user would, against every test.
      - run: scripts/test_wheel.sh dist ${{ matrix.python }}

  publish:
    name: Publish to PyPI
    needs: wheel
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/wirenote/
    permissions:
      contents: read
      id-token: write   # PyPI Trusted Publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    name: GitHub release page
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # creates the release and uploads its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes
          path: notes/
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *a*|*b*|*rc*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Wirenote $version" \
            --notes-file notes/release-notes.md $prerelease
